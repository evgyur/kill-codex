[package]
name = "kill-codex"
version = "1.3.1"
edition = "2024"
description = "Tiny native Windows utility that terminates Codex, DeepSeek Harness, Hermes Desktop, Amnezia, Discord, or Chrome."
license = "MIT"
repository = "https://github.com/evgyur/kill-codex"

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = "symbols"
